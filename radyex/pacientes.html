    </div>

    <div class="nav-section-label">Menú</div>
    <nav style="display:flex;flex-direction:column;gap:2px;">
      <a class="navitem" href="inicio.html">

        <span>Inicio</span>
      </a>
      <a class="navitem" href="ordenes.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
        <span>Órdenes</span>
      </a>
      <a class="navitem" href="doctores.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2v2"/><path d="M5 2v2"/><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/><path d="M8 15a6 6 0 0 0 12 0v-3"/><circle cx="20" cy="10" r="2"/></svg>
        <span>Doctores</span>
      </a>
      <a class="navitem" href="subir.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>
        <span>Subir archivos</span>
      </a>
      <a class="navitem active" href="pacientes.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21a8 8 0 0 0-16 0"/><circle cx="10" cy="8" r="5"/><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"/></svg>
        <span>Pacientes</span>
        <span class="badge" id="patBadge"></span>

      </a>
      <a class="navitem" href="reportes.html">

        <span>Reportes</span>

    <div class="sidebar-bottom">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar">RX</div>
        <div>
          <div class="sidebar-user-name">Equipo Radyex</div>
          <div class="sidebar-user-role">Personal interno</div>
        </div>
      </div>
      <a class="navitem" href="../index.html">

        <span>Salir</span>
      </a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <div class="topbar">
      <div>
        <div class="page-title">Pacientes</div>
        <div class="page-sub">Expediente y archivos de todos los pacientes del centro</div>
      </div>
      <div class="topbar-actions">
        <div class="avatar">RX</div>
      </div>
    </div>

    <div class="content">

      <div class="toolbar">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="searchInput" type="text" placeholder="Buscar paciente, folio o doctor...">
        </div>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Paciente</th>
              <th>Doctor referente</th>
              <th>Contacto</th>
              <th>Folio actual</th>
              <th>Estatus</th>
              <th>Archivos</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="patTableBody"></tbody>
        </table>
      </div>

    </div>

</div>

<!-- ====== MODAL: expediente del paciente ====== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card" id="modalCard">
    <button class="modal-close" id="modalClose" aria-label="Cerrar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>

    <div class="modal-header">
      <div class="modal-avatar" id="modalAvatar"></div>
      <div>
        <div class="modal-name" id="modalName"></div>
        <div class="modal-folio" id="modalFolio"></div>
      </div>
      <div class="status-pill" id="modalStatus" style="margin-left:auto;">
        <span class="dot"></span><span id="modalStatusLabel"></span>
      </div>
    </div>

    <div class="modal-info-grid" id="modalInfoGrid"></div>

    <div class="modal-section-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      Archivos del paciente
    </div>
    <div class="year-tabs" id="yearTabs"></div>
    <div class="file-list" id="fileList"></div>

    <div id="modalFooter" style="margin-top:20px;"></div>
  </div>
</div>

<script src="../assets/js/common.js"></script>
<script>
  const tbody = document.getElementById('patTableBody');
  const search = document.getElementById('searchInput');

  function render(){
    const q = search.value.trim().toLowerCase();
    const orders = RADYEX.getOrders();
    document.getElementById('patBadge').textContent = orders.length;

    const rows = orders.filter(o =>
      o.name.toLowerCase().includes(q) || o.code.toLowerCase().includes(q) || RADYEX.getDoctorById(o.doctorId).name.toLowerCase().includes(q)
    );

    tbody.innerHTML = rows.map(o => {
      const s = RADYEX.STATUS_MAP[o.status];
      const doc = RADYEX.getDoctorById(o.doctorId);
      return `
      <tr data-code="${o.code}">
        <td>
          <div class="cell-person">
            <div class="mini-avatar">${o.init}</div>
            <div><div class="cell-person-name">${o.name}</div><div class="cell-person-sub">${o.age} años · ${o.loc}</div></div>
          </div>
        </td>
        <td>${doc.name}</td>
        <td><div style="font-weight:600;color:var(--ink);">${o.phone}</div><div class="cell-person-sub">${o.email}</div></td>
        <td>${o.code}</td>
        <td><span class="status-pill ${s.cls}"><span class="dot"></span>${s.label}</span></td>
        <td>${RADYEX.countFiles(o)} archivo${RADYEX.countFiles(o) === 1 ? '' : 's'}</td>
        <td>
          <div class="table-actions">
            <button class="table-action" title="Ver expediente" aria-label="Ver expediente">${RADYEX.ICONS.eye}</button>
          </div>
        </td>
      </tr>`;
    }).join('');

    if (rows.length === 0){
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">No encontramos pacientes con esos criterios.</div></td></tr>`;
    }

    tbody.querySelectorAll('tr[data-code]').forEach(row => {
      row.addEventListener('click', () => openModal(RADYEX.getOrderByCode(row.dataset.code)));
    });
  }
  search.addEventListener('input', render);

  /* ====== Modal ====== */
  const overlay = document.getElementById('modalOverlay');

  function infoItem(iconKey, label, value){
    return `
      <div class="info-item">
        <div class="info-icon">${RADYEX.ICONS[iconKey]}</div>
        <div>
          <div class="info-label">${label}</div>
          <div class="info-value">${value}</div>
        </div>
      </div>`;
  }

  function openModal(o){
    document.getElementById('modalAvatar').textContent = o.init;
    document.getElementById('modalName').textContent = o.name;
    document.getElementById('modalFolio').textContent = `${o.code} · ${o.loc}`;

    const s = RADYEX.STATUS_MAP[o.status];
    document.getElementById('modalStatusLabel').textContent = s.label;
    document.getElementById('modalStatus').className = `status-pill ${s.cls}`;

    document.getElementById('modalInfoGrid').innerHTML =
      infoItem('doctor', 'Doctor referente', RADYEX.getDoctorById(o.doctorId).name) +
      infoItem('phone', 'Teléfono', o.phone) +
      infoItem('mail', 'Correo', o.email) +
      infoItem('age', 'Edad', o.age + ' años') +
      infoItem('since', 'Paciente desde', o.since) +
      infoItem('study', 'Tipo de estudio', o.studyType);

    renderYearTabs(o);

    const footer = document.getElementById('modalFooter');
    footer.innerHTML = o.status !== 'success'
      ? `<a class="btn-primary btn-block" href="subir.html?paciente=${encodeURIComponent(o.code)}">${RADYEX.ICONS.upload} Subir archivo para este paciente</a>`
      : '';

    overlay.classList.add('open');
  }

  function renderYearTabs(o){
    const years = Object.keys(o.files).sort((a,b)=>b-a);
    const tabsEl = document.getElementById('yearTabs');
    tabsEl.innerHTML = years.map((y,i)=>`<button class="year-tab ${i===0?'active':''}" data-year="${y}">${y}</button>`).join('');
    renderFiles(o, years[0]);
    tabsEl.querySelectorAll('.year-tab').forEach(tab=>{
      tab.addEventListener('click', ()=>{
        tabsEl.querySelectorAll('.year-tab').forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        renderFiles(o, tab.dataset.year);
      });
    });
  }

  function renderFiles(o, year){
    const filesEl = document.getElementById('fileList');
    const files = o.files[year] || [];
    if(files.length === 0){
      filesEl.innerHTML = `<div class="file-empty">Aún no hay archivos cargados para ${year}.</div>`;
      return;
    }
    filesEl.innerHTML = files.map(f => `
      <div class="file-row">
        <div class="file-icon">${RADYEX.ICONS.file}</div>
        <div>
          <div class="file-name">${f.name}</div>
          <div class="file-date">${f.date}</div>
        </div>
        <button class="file-action" title="Ver archivo" aria-label="Ver archivo" data-name="${f.name}" data-date="${f.date}" data-src="${f.src}">${RADYEX.ICONS.eye}</button>
      </div>
    `).join('');
  }

  document.getElementById('fileList').addEventListener('click', e => {
    const btn = e.target.closest('.file-action');
    if (!btn) return;
    RADYEX.openFileViewer({ name: btn.dataset.name, date: btn.dataset.date, src: btn.dataset.src });
  });

  function closeModal(){ overlay.classList.remove('open'); }
  document.getElementById('modalClose').addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

  render();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADYEX — Órdenes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo-wrap"><img class="brand-logo" src="../assets/logo/radyex-logo-white.svg" alt="RADYEX"></div>
    </div>
    <div class="role-tag">Panel interno</div>

    <div class="nav-section-label">Menú</div>
    <nav style="display:flex;flex-direction:column;gap:2px;">
      <a class="navitem" href="inicio.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>
        <span>Inicio</span>
      </a>
      <a class="navitem active" href="ordenes.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
        <span>Órdenes</span>
        <span class="badge" id="ordersBadge"></span>
      </a>
      <a class="navitem" href="doctores.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2v2"/><path d="M5 2v2"/><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/><path d="M8 15a6 6 0 0 0 12 0v-3"/><circle cx="20" cy="10" r="2"/></svg>
        <span>Doctores</span>
      </a>
      <a class="navitem" href="subir.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>
        <span>Subir archivos</span>
      </a>
      <a class="navitem" href="pacientes.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21a8 8 0 0 0-16 0"/><circle cx="10" cy="8" r="5"/><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"/></svg>
        <span>Pacientes</span>
      </a>
      <a class="navitem" href="bitacora.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        <span>Bitácora</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar">RX</div>
        <div>
          <div class="sidebar-user-name">Equipo Radyex</div>
          <div class="sidebar-user-role">Personal interno</div>
        </div>
      </div>
      <a class="navitem" href="../index.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
        <span>Salir</span>
      </a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <div class="topbar">
      <div>
        <div class="page-title">Órdenes</div>
        <div class="page-sub">Todas las órdenes solicitadas por los doctores referentes</div>
      </div>
      <div class="topbar-actions">
        <div class="avatar">RX</div>
      </div>
    </div>

    <div class="content">

      <div class="stats" id="statsGrid"></div>

      <div class="toolbar">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="searchInput" type="text" placeholder="Buscar paciente, folio o doctor...">
        </div>
        <div class="filters" id="filterChips">
          <button class="chip active" data-filter="todos">Todos</button>
          <button class="chip" data-filter="pending"><span class="dot" style="background:var(--pending)"></span>Pendiente</button>
          <button class="chip" data-filter="warn"><span class="dot" style="background:var(--warn)"></span>En proceso</button>
          <button class="chip" data-filter="success"><span class="dot" style="background:var(--success)"></span>Finalizado</button>
        </div>
      </div>

      <div class="order-list" id="orderList"></div>
      <p style="font-size:12.5px;color:var(--text-muted);margin-top:14px;">Toca cualquier orden para ver su información completa y sus archivos.</p>

    </div>
  </main>
</div>

<!-- ====== MODAL: detalle de orden ====== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card" id="modalCard">
    <button class="modal-close" id="modalClose" aria-label="Cerrar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>

    <div class="modal-header">
      <div class="modal-avatar" id="modalAvatar"></div>
      <div>
        <div class="modal-name" id="modalName"></div>
        <div class="modal-folio" id="modalFolio"></div>
      </div>
      <div class="status-pill" id="modalStatus" style="margin-left:auto;">
        <span class="dot"></span><span id="modalStatusLabel"></span>
      </div>
    </div>

    <div class="modal-info-grid" id="modalInfoGrid"></div>

    <div class="modal-section-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      Archivos del paciente
    </div>
    <div class="year-tabs" id="yearTabs"></div>
    <div class="file-list" id="fileList"></div>

    <div id="modalFooter" style="margin-top:20px;"></div>
  </div>
</div>

<script src="../assets/js/common.js"></script>
<script>
  const orders = RADYEX.getOrders();
  document.getElementById('ordersBadge').textContent = orders.length;

  const pendingCount = orders.filter(o => o.status === 'pending').length;
  const warnCount = orders.filter(o => o.status === 'warn').length;
  const successCount = orders.filter(o => o.status === 'success').length;

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--pending-soft);color:var(--pending);">${RADYEX.ICONS.orders}</div>
      <div><div class="stat-num">${orders.length}</div><div class="stat-label">Órdenes totales</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--warn-soft);color:var(--warn);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div>
      <div><div class="stat-num">${warnCount}</div><div class="stat-label">En proceso</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--success-soft);color:var(--success);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m4 12 5 5 11-11"/></svg></div>
      <div><div class="stat-num">${successCount}</div><div class="stat-label">Finalizadas</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--pending-soft);color:var(--ink-soft);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg></div>
      <div><div class="stat-num">${pendingCount}</div><div class="stat-label">Pendientes</div></div>
    </div>
  `;

  const list = document.getElementById('orderList');
  const search = document.getElementById('searchInput');
  let activeFilter = 'todos';

  function render(){
    const q = search.value.trim().toLowerCase();
    list.innerHTML = '';
    orders
      .filter(o => activeFilter === 'todos' || o.status === activeFilter)
      .filter(o => o.name.toLowerCase().includes(q) || o.code.toLowerCase().includes(q) || RADYEX.getDoctorById(o.doctorId).name.toLowerCase().includes(q))
      .forEach(o => {
        const s = RADYEX.STATUS_MAP[o.status];
        const doc = RADYEX.getDoctorById(o.doctorId);
        const card = document.createElement('div');
        card.className = `order-card status-${o.status}`;
        card.innerHTML = `
          <div class="order-avatar">${o.init}</div>
          <div class="order-main">
            <div class="order-name">${o.name}</div>
            <div class="order-meta">
              <div class="order-meta-item">${RADYEX.ICONS.doctor}${doc.name}</div>
              <div class="order-meta-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16"/></svg>${o.code}</div>
              <div class="order-meta-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>${o.date}</div>
              <div class="order-meta-item">${RADYEX.ICONS.study}${o.studyType}</div>
            </div>
          </div>
          <div class="status-pill ${s.cls}"><span class="dot"></span>${s.label}</div>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
        `;
        card.addEventListener('click', () => openModal(o));
        list.appendChild(card);
      });

    if(list.children.length === 0){
      list.innerHTML = `<div class="empty-state">No encontramos órdenes con esos criterios.</div>`;
    }
  }

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeFilter = chip.dataset.filter;
      render();
    });
  });
  search.addEventListener('input', render);

  /* ====== Modal ====== */
  const overlay = document.getElementById('modalOverlay');

  function infoItem(iconKey, label, value){
    return `
      <div class="info-item">
        <div class="info-icon">${RADYEX.ICONS[iconKey]}</div>
        <div>
          <div class="info-label">${label}</div>
          <div class="info-value">${value}</div>
        </div>
      </div>`;
  }

  function openModal(o){
    document.getElementById('modalAvatar').textContent = o.init;
    document.getElementById('modalName').textContent = o.name;
    document.getElementById('modalFolio').textContent = `${o.code} · ${o.loc}`;

    const s = RADYEX.STATUS_MAP[o.status];
    document.getElementById('modalStatusLabel').textContent = s.label;
    document.getElementById('modalStatus').className = `status-pill ${s.cls}`;

    document.getElementById('modalInfoGrid').innerHTML =
      infoItem('doctor', 'Doctor referente', RADYEX.getDoctorById(o.doctorId).name) +
      infoItem('phone', 'Teléfono', o.phone) +
      infoItem('mail', 'Correo', o.email) +
      infoItem('age', 'Edad', o.age + ' años') +
      infoItem('since', 'Paciente desde', o.since) +
      infoItem('study', 'Tipo de estudio', o.studyType);

    renderYearTabs(o);

    const footer = document.getElementById('modalFooter');
    if (o.status !== 'success') {
      footer.innerHTML = `<a class="btn-primary btn-block" href="subir.html?paciente=${encodeURIComponent(o.code)}">
        ${RADYEX.ICONS.upload} Subir archivo para este paciente
      </a>`;
    } else {
      footer.innerHTML = '';
    }

    overlay.classList.add('open');
  }

  function renderYearTabs(o){
    const years = Object.keys(o.files).sort((a,b)=>b-a);
    const tabsEl = document.getElementById('yearTabs');
    tabsEl.innerHTML = years.map((y,i)=>`<button class="year-tab ${i===0?'active':''}" data-year="${y}">${y}</button>`).join('');
    renderFiles(o, years[0]);
    tabsEl.querySelectorAll('.year-tab').forEach(tab=>{
      tab.addEventListener('click', ()=>{
        tabsEl.querySelectorAll('.year-tab').forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        renderFiles(o, tab.dataset.year);
      });
    });
  }

  function renderFiles(o, year){
    const filesEl = document.getElementById('fileList');
    const files = o.files[year] || [];
    if(files.length === 0){
      filesEl.innerHTML = `<div class="file-empty">Aún no hay archivos cargados para ${year}.</div>`;
      return;
    }
    filesEl.innerHTML = files.map(f => `
      <div class="file-row">
        <div class="file-icon">${RADYEX.ICONS.file}</div>
        <div>
          <div class="file-name">${f.name}</div>
          <div class="file-date">${f.date}</div>
        </div>
        <button class="file-action" title="Ver archivo" aria-label="Ver archivo" data-name="${f.name}" data-date="${f.date}" data-src="${f.src}">${RADYEX.ICONS.eye}</button>
      </div>
    `).join('');
  }

  document.getElementById('fileList').addEventListener('click', e => {
    const btn = e.target.closest('.file-action');
    if (!btn) return;
    RADYEX.openFileViewer({ name: btn.dataset.name, date: btn.dataset.date, src: btn.dataset.src });
  });

  function closeModal(){ overlay.classList.remove('open'); }
  document.getElementById('modalClose').addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

  render();
</script>

</body>
</html>
